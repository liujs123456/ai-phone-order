# Production: PostgreSQL (Supabase). Set the env vars before starting.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: ${PORT:8080}
