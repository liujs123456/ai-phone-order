# Local dev: H2 in Postgres-compatibility mode. No external service needed.
# Switch to a local Postgres at any time by overriding the datasource block.
spring:
  datasource:
    url: jdbc:h2:mem:orderdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
